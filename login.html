<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RUANI - Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#050505,#111827,#050505);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  padding:35px 25px;
  border-radius:24px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:42px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:30px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#ddd;
  font-size:14px;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
  background:#111;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#666;
}

button{
  width:100%;
  margin-top:25px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

#status{
  text-align:center;
  margin-top:18px;
  min-height:20px;
  color:#aaa;
  font-size:14px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">RUANI</div>

  <div class="subtitle">
    AI Gym Manager
  </div>

  <form id="loginForm">

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      required
    >

    <button id="loginBtn" type="submit">
      Login
    </button>

    <div id="status"></div>

  </form>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const status = document.getElementById("status");


form.addEventListener("submit", async (e) => {

  e.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if(!email || !password){

    status.textContent = "Email aur password enter karo.";
    return;
  }

  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";
  status.textContent = "";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    status.textContent = "Login successful...";

    window.location.href = "dashboard.html";

  }catch(error){

    console.error(error);

    status.textContent =
      "Login failed. Email ya password check karo.";

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";
  }

});

</script>

</body>
</html>
