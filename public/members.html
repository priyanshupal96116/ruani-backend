<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RUANI — Members</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left,#24135c,transparent 35%),
    radial-gradient(circle at bottom right,#082d4f,transparent 35%),
    #070914;
  color:#fff;
}

.container{max-width:1100px;margin:auto;padding:20px}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{font-size:28px;font-weight:900;letter-spacing:2px}
.logo span{color:#8b5cf6}

.back{
  color:#fff;
  text-decoration:none;
  padding:10px 15px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  background:rgba(255,255,255,.05);
}

.card{
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:20px;
  margin-bottom:18px;
  backdrop-filter:blur(16px);
}

h1{font-size:28px;margin-bottom:7px}
.sub{color:#9ca3b5;margin-bottom:20px}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  padding:18px;
  border-radius:16px;
  background:rgba(255,255,255,.04);
}

.stat small{color:#9ca3b5}
.stat b{display:block;font-size:28px;margin-top:8px}

.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.1);
  background:#101322;
  color:#fff;
  outline:none;
}

button{
  border:0;
  cursor:pointer;
}

.add-btn{
  grid-column:1/-1;
  padding:14px;
  border-radius:12px;
  background:#7c5cff;
  color:#fff;
  font-weight:bold;
}

.search{
  margin-bottom:15px;
}

.member{
  padding:18px;
  border-radius:16px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.07);
  margin-bottom:12px;
}

.member-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.member h3{font-size:18px}

.badge{
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.active{
  background:rgba(30,220,120,.12);
  color:#71f0a6;
}

.expired{
  background:rgba(255,70,70,.12);
  color:#ff8585;
}

.info{
  color:#aeb4c7;
  font-size:13px;
  margin-top:10px;
  line-height:1.8;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:13px;
  flex-wrap:wrap;
}

.action{
  padding:9px 12px;
  border-radius:10px;
  color:#fff;
  background:rgba(124,92,255,.15);
  border:1px solid rgba(124,92,255,.25);
}

.delete{
  background:rgba(255,60,60,.1);
  border-color:rgba(255,60,60,.2);
  color:#ff8888;
}

.empty{
  text-align:center;
  color:#9299ad;
  padding:30px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  z-index:10;
}

.modal-box{
  background:#111425;
  padding:25px;
  border-radius:20px;
  text-align:center;
  width:min(90%,360px);
}

#qr{
  background:#fff;
  padding:12px;
  width:max-content;
  margin:20px auto;
}

.close{
  padding:11px 20px;
  border-radius:10px;
  background:#7c5cff;
  color:#fff;
}

@media(max-width:600px){
  .container{padding:14px}
  .form{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .add-btn{grid-column:auto}
}
</style>
</head>

<body>

<div class="container">

  <div class="topbar">
    <div class="logo">RUANI<span>.</span></div>
    <a href="dashboard.html" class="back">← Dashboard</a>
  </div>

  <div class="card">
    <h1>Members</h1>
    <p class="sub">Manage your gym members</p>

    <div class="stats">
      <div class="stat">
        <small>Total</small>
        <b id="total">0</b>
      </div>

      <div class="stat">
        <small>Active</small>
        <b id="active">0</b>
      </div>

      <div class="stat">
        <small>Expired</small>
        <b id="expired">0</b>
      </div>
    </div>
  </div>

  <div class="card">

    <h2 style="margin-bottom:15px">Add New Member</h2>

    <div class="form">

      <input id="name" type="text" placeholder="Member name">

      <input id="phone" type="tel" placeholder="Phone number">

      <select id="plan">
        <option value="Monthly">Monthly</option>
        <option value="Quarterly">Quarterly</option>
        <option value="Half Yearly">Half Yearly</option>
        <option value="Yearly">Yearly</option>
      </select>

      <input id="startDate" type="date">

      <input id="endDate" type="date">

      <button class="add-btn" id="addBtn">
        + Add Member
      </button>

    </div>
  </div>

  <div class="card">

    <input
      class="search"
      id="search"
      type="search"
      placeholder="Search member..."
    >

    <div id="membersList">
      <div class="empty">Loading members...</div>
    </div>

  </div>

</div>


<div class="modal" id="qrModal">

  <div class="modal-box">

    <h2>Member QR</h2>

    <div id="qr"></div>

    <p style="color:#9ca3b5;font-size:12px">
      Scan this QR for attendance
    </p>

    <br>

    <button class="close" id="closeQr">
      Close
    </button>

  </div>

</div>


<script type="module">

import { auth, db } from "./firebase.js";

import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  collection,
  addDoc,
  getDocs,
  query,
  where,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


let currentUser = null;
let members = [];


const nameInput = document.getElementById("name");
const phoneInput = document.getElementById("phone");
const planInput = document.getElementById("plan");
const startInput = document.getElementById("startDate");
const endInput = document.getElementById("endDate");

const list = document.getElementById("membersList");
const search = document.getElementById("search");


function getStatus(endDate){

  if(!endDate) return "active";

  const today = new Date();
  today.setHours(0,0,0,0);

  const end = new Date(endDate);
  end.setHours(0,0,0,0);

  return end >= today ? "active" : "expired";
}


function render(){

  const term =
    search.value.trim().toLowerCase();

  const filtered = members.filter(member =>
    String(member.name || "")
      .toLowerCase()
      .includes(term) ||
    String(member.phone || "")
      .toLowerCase()
      .includes(term)
  );


  document.getElementById("total").textContent =
    members.length;

  document.getElementById("active").textContent =
    members.filter(m => getStatus(m.endDate) === "active").length;

  document.getElementById("expired").textContent =
    members.filter(m => getStatus(m.endDate) === "expired").length;


  if(filtered.length === 0){

    list.innerHTML =
      `<div class="empty">No members found.</div>`;

    return;
  }


  list.innerHTML = filtered.map(member => {

    const status = getStatus(member.endDate);

    return `
      <div class="member">

        <div class="member-top">

          <h3>${escapeHtml(member.name || "Member")}</h3>

          <span class="badge ${status}">
            ${status.toUpperCase()}
          </span>

        </div>

        <div class="info">

          📱 ${escapeHtml(member.phone || "No phone")}<br>

          💪 Plan: ${escapeHtml(member.plan || "Monthly")}<br>

          📅 Start: ${escapeHtml(member.startDate || "-")}<br>

          ⏳ End: ${escapeHtml(member.endDate || "-")}

        </div>

        <div class="actions">

          <button
            class="action"
            onclick="showQR('${member.id}')"
          >
            QR
          </button>

          <button
            class="action delete"
            onclick="deleteMember('${member.id}')"
          >
            Delete
          </button>

        </div>

      </div>
    `;

  }).join("");

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


async function loadMembers(){

  const q = query(
    collection(db,"members"),
    where("ownerId","==",currentUser.uid)
  );

  const snap = await getDocs(q);

  members = [];

  snap.forEach(item => {

    members.push({
      id:item.id,
      ...item.data()
    });

  });

  render();

}


document.getElementById("addBtn")
.addEventListener("click",async()=>{

  const name = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const plan = planInput.value;
  const startDate = startInput.value;
  const endDate = endInput.value;


  if(!name){

    alert("Member name enter karo.");
    return;

  }


  if(!startDate || !endDate){

    alert("Start aur End date select karo.");
    return;

  }


  if(new Date(endDate) < new Date(startDate)){

    alert("End date Start date se pehle nahi ho sakti.");
    return;

  }


  try{

    const memberRef = await addDoc(
      collection(db,"members"),
      {
        ownerId:currentUser.uid,
        name:name,
        phone:phone,
        plan:plan,
        startDate:startDate,
        endDate:endDate,
        createdAt:new Date().toISOString()
      }
    );


    await updateDoc(
      doc(db,"members",memberRef.id),
      {
        qrId:memberRef.id
      }
    );


    nameInput.value="";
    phoneInput.value="";
    startInput.value="";
    endInput.value="";


    await loadMembers();

    alert("Member added successfully!");

  }catch(error){

    console.error(error);

    alert("Member add nahi hua: " + error.message);

  }

});


search.addEventListener("input",render);


window.deleteMember = async function(id){

  const ok =
    confirm("Is member ko delete karna hai?");

  if(!ok) return;


  try{

    await deleteDoc(
      doc(db,"members",id)
    );

    members =
      members.filter(m => m.id !== id);

    render();

  }catch(error){

    console.error(error);

    alert("Delete failed: " + error.message);

  }

};


window.showQR = function(memberId){

  const member =
    members.find(m => m.id === memberId);

  if(!member) return;


  const modal =
    document.getElementById("qrModal");

  const qr =
    document.getElementById("qr");

  qr.innerHTML="";

  new QRCode(qr,{
    text:member.qrId || member.id,
    width:220,
    height:220,
    correctLevel:QRCode.CorrectLevel.H
  });

  modal.style.display="flex";

};


document.getElementById("closeQr")
.addEventListener("click",()=>{

  document.getElementById("qrModal")
    .style.display="none";

});


onAuthStateChanged(auth,user=>{

  if(!user){

    window.location.href="login.html";
    return;

  }

  currentUser=user;

  loadMembers();

});

</script>

</body>
</html>
